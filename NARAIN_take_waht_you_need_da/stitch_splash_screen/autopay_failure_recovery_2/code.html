<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Recovery - ProtoRyde</title>

                    "on-primary-fixed-variant": "#264679",
                    "on-tertiary-fixed": "#2e1500",
                    "on-surface": "#191c1e",
                    "on-error-container": "#93000a",
                    "on-background": "#191c1e",
                    "tertiary-container": "#5e3100",
                    "surface-tint": "#405e92",
                    "on-tertiary-container": "#db9960",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#ffdcc2",

                    "tertiary": "#3e1f00",

                    "on-primary-fixed": "#001b3f",
                    "secondary": "#835500",
                    "inverse-primary": "#abc7ff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#6b3b09",
                    "on-secondary-fixed-variant": "#633f00",

                    "surface-variant": "#e0e3e6",

            "borderRadius": {

<style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fc; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full z-50 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-lg shadow-sm flex items-center justify-between px-6 py-3 w-full">
<div class="flex items-center gap-3">
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-blue-900">arrow_back</span>
</button>
<span class="font-['Manrope'] font-bold text-lg tracking-tight text-blue-900">Payment Issue</span>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-highest">
<img alt="User Profile" data-alt="close-up portrait of a delivery partner professional in a clean blue uniform with a warm friendly expression" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDiS_yuLLLuh4nzqe5i6qrsM2jdDSMjQAtC6tBBsJ3WIQQhidVay-g5zKiNLmhp477wJ3WrLgX0pvzGoVBKU5U-ZtJEj8KuaT1m_FKe4OzMNpsQ3BhFKzGr2NM8ruvr6Hyit6GMOIBb32EENTxbn5lYnexx9lzwd3jA6DGYiE6cPAHhApSYouMH_Hkb2HLU1lEY3n_1Xyo2ODrZ1uQ1vNdhRLNwVxzp0AhEa8KqI8hGNsRyL1HRydMc-1EfuFBAoI19DuJzoC9bzw"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-16 pb-32 px-5 max-w-[390px] mx-auto w-full">
<!-- Top Danger Banner -->
<section class="mt-4 mb-6">
<div class="bg-error-container text-on-error-container p-4 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-headline font-extrabold text-[15px] tracking-tight">Payment Failed - Coverage at Risk</span>
</div>
</section>
<!-- Main Recovery Card (Bento-style layout) -->
<section class="space-y-4">
<!-- Amount & Grace Period Card -->
<div class="bg-surface-container-lowest p-6 rounded-xl shadow-[0_12px_32px_-4px_rgba(25,28,30,0.08)] relative overflow-hidden">
<div class="absolute top-0 right-0 p-3">
<div class="bg-[#db99601a] text-on-tertiary-container px-3 py-1 rounded-full flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="text-[11px] font-bold font-label">Expiring soon</span>
</div>
</div>
<p class="text-on-surface-variant font-label text-xs uppercase tracking-wider mb-1">Amount Due</p>
<h1 class="text-4xl font-headline font-extrabold text-primary mb-6">₹67</h1>
<div class="space-y-4">
<div class="bg-surface-container-low p-4 rounded-lg flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-on-surface-variant text-sm font-medium">Reason</span>
<span class="text-on-surface text-sm font-bold">UPI handle unavailable</span>
</div>
</div>
<div class="bg-tertiary-container/10 p-4 rounded-lg border-l-4 border-tertiary-container">
<p class="text-on-surface-variant text-[11px] font-medium mb-1 uppercase tracking-tight">Coverage expires in</p>
<p class="text-on-tertiary-container font-headline font-bold text-lg">11h 23m</p>
</div>
</div>
</div>
<!-- Action Cluster -->
<div class="grid grid-cols-1 gap-3 mt-8">
<!-- Action: Retry Same -->
<button class="w-full bg-surface-container-lowest p-4 rounded-xl flex items-center justify-between hover:bg-surface-container-high active:scale-[0.98] transition-all group">
<div class="flex items-center gap-4">
<div class="bg-primary/5 p-2 rounded-lg group-hover:bg-primary/10">
<span class="material-symbols-outlined text-primary">refresh</span>
</div>
<div class="text-left">
<p class="text-on-surface font-semibold text-sm">Retry same UPI</p>
<p class="text-on-surface-variant text-xs">shubh-pay@okaxis</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- Action: Change UPI -->
<button class="w-full bg-surface-container-lowest p-4 rounded-xl flex items-center justify-between hover:bg-surface-container-high active:scale-[0.98] transition-all group">
<div class="flex items-center gap-4">
<div class="bg-secondary-container/10 p-2 rounded-lg group-hover:bg-secondary-container/20">
<span class="material-symbols-outlined text-secondary">edit_square</span>
</div>
<div class="text-left">
<p class="text-on-surface font-semibold text-sm">Change UPI ID</p>
<p class="text-on-surface-variant text-xs">Add a new bank account</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- Action: Manual Pay -->
<button class="w-full bg-surface-container-lowest p-4 rounded-xl flex items-center justify-between hover:bg-surface-container-high active:scale-[0.98] transition-all group">
<div class="flex items-center gap-4">
<div class="bg-tertiary-container/10 p-2 rounded-lg group-hover:bg-tertiary-container/20">
<span class="material-symbols-outlined text-tertiary">account_balance_wallet</span>
</div>
<div class="text-left">
<p class="text-on-surface font-semibold text-sm">Pay manually now</p>
<p class="text-on-surface-variant text-xs">Card, Netbanking, or Wallets</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Illustration / Background Texture (Editorial element) -->
<div class="mt-12 flex justify-center opacity-30">
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-primary to-primary-container blur-3xl"></div>
</div>
</main>
<!-- Bottom Fixed CTA Section -->
<footer class="fixed bottom-0 left-0 w-full bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl px-6 pt-4 pb-10 flex flex-col items-center gap-4 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<p class="text-on-surface-variant text-[12px] font-medium text-center">No penalty if paid within grace window.</p>
<button class="w-full h-14 rounded-xl bg-gradient-to-br from-[#1b5e20] to-[#2e7d32] text-white font-headline font-bold text-[16px] shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">verified_user</span>
            Pay ₹67 and Restore Coverage
        </button>
</footer>
<!-- Bottom Navigation (Shared Component Logic - Filtered for Task Context) -->
<!-- Suppressed: Task-focused sub-page with back action -->
</body></html>
